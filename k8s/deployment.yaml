apiVersion: apps/v1
kind: Deployment
metadata:
  name: prism0
  labels:
    app.kubernetes.io/name: prism0
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: prism0
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prism0
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: prism0
          image: ghcr.io/brianlechthaler/prism0:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: prism0-config
            - secretRef:
                name: prism0-secrets
          ports:
            - name: http
              containerPort: 8787
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: validation-runs
              mountPath: /app/backend/validation-harness/runs
      volumes:
        - name: validation-runs
          emptyDir:
            sizeLimit: 1Gi
