name: Docker

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  docker-build:
    name: Build Docker image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: prism0:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test image
        run: |
          docker run --detach \
            --name prism0-ci-smoke \
            --env OPENAI_API_KEY=ci-smoke-test \
            --publish 8787:8787 \
            prism0:ci
          trap 'docker rm -f prism0-ci-smoke >/dev/null 2>&1 || true' EXIT

          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:8787/api/health; then
              exit 0
            fi

            if [ "$(docker inspect -f '{{.State.Running}}' prism0-ci-smoke 2>/dev/null)" != "true" ]; then
              echo "Container exited before becoming healthy" >&2
              docker logs prism0-ci-smoke >&2 || true
              exit 1
            fi

            sleep 1
          done

          echo "Docker image failed smoke test" >&2
          docker logs prism0-ci-smoke >&2 || true
          exit 1
