name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  install:
    name: Install dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Save node_modules cache
        uses: actions/cache/save@v4
        with:
          path: |
            node_modules
            backend/node_modules
            frontend/node_modules
            backend/validation-harness/node_modules
          key: node-modules-${{ hashFiles('package-lock.json', 'backend/package.json', 'frontend/package.json', 'backend/validation-harness/package-lock.json') }}

  lint-typecheck:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    needs: install

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Restore node_modules cache
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            backend/node_modules
            frontend/node_modules
            backend/validation-harness/node_modules
          key: node-modules-${{ hashFiles('package-lock.json', 'backend/package.json', 'frontend/package.json', 'backend/validation-harness/package-lock.json') }}

      - name: Lint and typecheck workspaces
        run: npm run lint && npm run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: install
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Restore node_modules cache
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            backend/node_modules
            frontend/node_modules
            backend/validation-harness/node_modules
          key: node-modules-${{ hashFiles('package-lock.json', 'backend/package.json', 'frontend/package.json', 'backend/validation-harness/package-lock.json') }}

      - name: Run tests
        run: npm test

      - name: Build production artifacts
        run: npm run build

      - name: Upload production build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: production-build
          path: |
            backend/dist
            frontend/dist
          if-no-files-found: error

      - name: Smoke test production server
        run: |
          OPENAI_API_KEY=ci-smoke-test npm start &
          server_pid=$!
          trap "kill $server_pid" EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:8787/api/health; then
              exit 0
            fi
            sleep 1
          done
          echo "Production server failed smoke test" >&2
          exit 1

  docker:
    name: Docker image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: prism0:ci
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test image
        run: |
          docker run --detach \
            --name prism0-ci-smoke \
            --env OPENAI_API_KEY=ci-smoke-test \
            --publish 8787:8787 \
            prism0:ci
          trap 'docker rm -f prism0-ci-smoke >/dev/null 2>&1 || true' EXIT

          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:8787/api/health; then
              exit 0
            fi

            if [ "$(docker inspect -f '{{.State.Running}}' prism0-ci-smoke 2>/dev/null)" != "true" ]; then
              echo "Container exited before becoming healthy" >&2
              docker logs prism0-ci-smoke >&2 || true
              exit 1
            fi

            sleep 1
          done

          echo "Docker image failed smoke test" >&2
          docker logs prism0-ci-smoke >&2 || true
          exit 1

  ollama-docker:
    name: Ollama Docker stack
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate ollama-docker script
        run: |
          bash -n scripts/ollama-docker.sh
          shellcheck --severity=warning scripts/ollama-docker.sh

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build prism0 image for stack test
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: prism0:ci
          provenance: false
          sbom: false
          cache-from: type=gha

      - name: Smoke test CPU-only Ollama stack
        run: |
          PRISM0_IMAGE=prism0:ci \
          SKIP_IMAGE_PULL=1 \
          OLLAMA_GPU=0 \
          SKIP_MODEL_PULL=1 \
          ./scripts/ollama-docker.sh start
          trap './scripts/ollama-docker.sh stop >/dev/null 2>&1 || true' EXIT
          ./scripts/ollama-docker.sh status
          docker exec prism0-ollama ollama list

      - name: Verify GPU is on by default
        run: |
          ./scripts/ollama-docker.sh --help | grep -F "GPU acceleration is enabled by default"
          grep -q 'OLLAMA_GPU="${OLLAMA_GPU:-all}"' scripts/ollama-docker.sh
          grep -q 'OLLAMA_CPU_MODEL_DEFAULT="qwen2.5-coder:7b"' scripts/ollama-docker.sh
          grep -q 'OLLAMA_GPU_MODEL_DEFAULT="qwen2.5-coder:32b"' scripts/ollama-docker.sh
          grep -q 'resolve_model_settings' scripts/ollama-docker.sh
          grep -q -- '--cpu' scripts/ollama-docker.sh

      - name: Verify GHCR pull fallback to local build
        run: |
          ./scripts/ollama-docker.sh --help | grep -F "PRISM0_PULL_ONLY=1"
          grep -q 'local_repo_available()' scripts/ollama-docker.sh
          grep -q 'Could not pull' scripts/ollama-docker.sh

  kubernetes:
    name: Kubernetes manifests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"

      - name: Cache kubeconform
        id: kubeconform-cache
        uses: actions/cache@v4
        with:
          path: ~/go/bin/kubeconform
          key: kubeconform-${{ runner.os }}-${{ runner.arch }}-v0.6.7

      - name: Install kubeconform
        if: steps.kubeconform-cache.outputs.cache-hit != 'true'
        run: go install github.com/yannh/kubeconform/cmd/kubeconform@v0.6.7

      - name: Render Kustomize manifests
        run: kubectl kustomize k8s > /tmp/prism0-k8s.yaml

      - name: Validate default manifests
        run: kubeconform -strict -summary /tmp/prism0-k8s.yaml

      - name: Validate optional manifests
        run: |
          kubeconform -strict -summary k8s/secret.example.yaml
          kubeconform -strict -summary k8s/hpa.yaml

      - name: Upload rendered Kubernetes manifests
        uses: actions/upload-artifact@v4
        with:
          name: kubernetes-manifests
          path: /tmp/prism0-k8s.yaml
          if-no-files-found: error
