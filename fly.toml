app = "prism0"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  HOST = "0.0.0.0"
  PORT = "8787"
  OPENAI_BASE_URL = "https://api.openai.com/v1"
  OPENAI_MODEL = "gpt-4.1-mini"
  REQUEST_TIMEOUT_MS = "120000"
  MAX_RUNS = "100"
  TRUST_PROXY = "true"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 40
    hard_limit = 50

  [[http_service.checks]]
    interval = "10s"
    timeout = "2s"
    grace_period = "10s"
    method = "GET"
    path = "/api/health"
